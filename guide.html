<style>
:root{--bg:#f3f1fb;--ink:#1c1a33;--mute:#62607c;--line:#dfdbf0;--h1:#5b4bdb;--h2:#8b7bff;--ng:#c2392b}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.62 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
#app{max-width:1020px;margin:0 auto}a{color:inherit}
.lock{padding:26px 16px;max-width:520px;margin:0 auto}.lock h1{font-size:25px;margin:6px 0;color:var(--h1)}.sub{color:var(--mute);font-size:16px;margin:0 0 14px}
.note{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 22px rgba(70,50,170,.14)}
.btn{font:inherit;font-weight:800;border:0;background:#fff;color:var(--ink);border-radius:12px;padding:9px 14px;cursor:pointer}.pri{background:linear-gradient(120deg,var(--h1),var(--h2));color:#fff}
.hero{background:linear-gradient(125deg,#5b4bdb,#e0417c 60%,#ef7d00);color:#fff;padding:30px 20px 26px;border-radius:0 0 26px 26px}.hero small{font-size:16px;font-weight:700;opacity:.92}.hero h1{font-size:31px;line-height:1.25;margin:4px 0 8px}.hero p{margin:0;font-size:16.5px;opacity:.95}
.home{padding:18px 14px 50px}.hh{font-size:20px;font-weight:900;margin:8px 4px 12px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gc{display:block;text-decoration:none;color:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 20px rgba(40,30,110,.2)}.gc b{display:block;font-size:26px;line-height:1.25}.gc span{font-size:16px;font-weight:600;opacity:.95}
.res{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:14px 16px;margin:0 0 14px;font-weight:800;text-decoration:none;box-shadow:0 4px 14px rgba(70,50,170,.12)}.res i{font-style:normal;font-size:24px}.res em{margin-left:auto;font-style:normal;color:var(--h1)}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(120deg,var(--h1),var(--h2));color:#fff;box-shadow:0 3px 12px rgba(30,20,90,.28)}
.tr{display:flex;align-items:center;gap:10px;padding:9px 12px}.tr b{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bk{background:rgba(255,255,255,.22);color:#fff;font-size:16px;padding:7px 12px;border-radius:11px;text-decoration:none;font-weight:800}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;font-size:15.5px;font-weight:800;text-decoration:none;color:#fff;background:rgba(255,255,255,.22);border-radius:999px;padding:5px 13px;white-space:nowrap}.chips a.on{background:#fff;color:var(--h1)}
main{padding:12px 10px 60px}
article{background:#fff;border-radius:22px;margin:0 0 28px;overflow:hidden;box-shadow:0 8px 26px rgba(50,35,140,.14);scroll-margin-top:112px}
.ah{background:linear-gradient(120deg,var(--h1),var(--h2));color:#fff;padding:14px 18px;font-size:23px;font-weight:900;line-height:1.3}.ah small{display:block;font-size:15.5px;font-weight:700;opacity:.92}
.inner{padding:14px}
.sum{display:grid;gap:10px;margin-bottom:18px}
.sc{border-radius:16px;padding:12px 14px;border-left:8px solid}.sc .l{display:inline-block;color:#fff;font-size:15.5px;font-weight:900;border-radius:8px;padding:1px 11px;margin-bottom:5px}.sc .k{font-size:21px;font-weight:900;line-height:1.42}.sc .e{font-size:17px;color:#3b3858;line-height:1.45;margin-top:3px}
.sc.t{background:#efeafe;border-color:#6a3fe0}.sc.t .l{background:#6a3fe0}.sc.t .k{color:#4a25b8}
.sc.p{background:#dff7f3;border-color:#0e9f8e}.sc.p .l{background:#0e9f8e}.sc.p .k{color:#06685c}
.sc.g{background:#fff0dd;border-color:#ef7d00}.sc.g .l{background:#ef7d00}.sc.g .k{color:#a85200}
.sh{display:flex;align-items:center;gap:9px;color:#fff;font-size:22px;font-weight:900;border-radius:14px;padding:9px 15px;margin:22px 0 11px}
.sh.ps{background:linear-gradient(120deg,#3b4cca,#6a7bff)}.sh.gr{background:linear-gradient(120deg,#d81e6c,#ff6ea3)}.sh.vo{background:linear-gradient(120deg,#118a4e,#42c97f)}.sh.fl{background:linear-gradient(120deg,#e8590c,#ffa94d)}
.sr{display:grid;grid-template-columns:42px 1fr 1fr;border-bottom:1px solid var(--line);position:relative}.sr:last-child{border-bottom:0}
.no{font-size:23px;font-weight:900;color:#3b4cca;padding:11px 0 11px 5px;line-height:1.3}.en{padding:11px 12px 11px 2px;font-size:19.5px;line-height:1.56}.ko{padding:11px 12px;background:#f1f2ff;font-size:18px;line-height:1.56;color:#2c2a57}
.sr.st{background:linear-gradient(100deg,#ffe066,#ffd43b);border:3px solid #f76707;border-radius:14px;margin:8px 0;padding-top:30px}.sr.st .ko{background:transparent;color:#3a2b00;font-weight:600}.sr.st .no{color:#d9480f}.sr.st .en{font-weight:600}
.stag{position:absolute;left:0;top:0;background:#f76707;color:#fff;font-size:16px;font-weight:900;padding:3px 14px;border-radius:9px 0 12px 0}
mark{background:#ffd6e7;color:#ad1457;font-weight:800;border-radius:5px;padding:0 3px;border-bottom:3px solid #d81e6c}mark sup{font-size:.68em;color:#d81e6c;margin-left:1px;font-weight:900}
b.v{color:#0b7a42;font-weight:900;background:#d8f6e5;border-radius:5px;padding:0 3px}
.gi{display:flex;gap:11px;align-items:flex-start;background:#fff0f6;border:2px solid #ffc2d9;border-radius:15px;padding:12px 14px;margin:9px 0}.gi .n{flex:none;width:36px;height:36px;border-radius:50%;background:#d81e6c;color:#fff;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center}.gi .q{font-size:21px;font-weight:900;color:#b0125b;line-height:1.38}.gi .w{font-size:19px;line-height:1.55;margin-top:2px}.gi .sn{color:#3b4cca;font-weight:900}
.vi{background:#effbf3;border:2px solid #b5ecc9;border-radius:15px;padding:12px 14px;margin:9px 0}.vi .wd{font-size:24px;font-weight:900;color:#0b7a42;margin-right:9px}.vi .m{font-size:20px;font-weight:800}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.tg span{font-size:18px;font-weight:700;border-radius:999px;padding:3px 13px}.tg .y{background:#14a05a;color:#fff}.tg .a{background:#e03131;color:#fff}
.st0{background:#fff4e6;border:3px solid #ffb976;border-radius:17px;padding:13px 15px}.st0 .h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}.st0 .rg{font-size:22px;font-weight:900;color:#d9480f}.st0 .tt{background:#e8590c;color:#fff;font-size:17px;font-weight:900;border-radius:9px;padding:2px 12px}.st0 .x{font-size:20px;font-weight:600;line-height:1.56;color:#3a2410}
.lk{display:flex;gap:9px;align-items:flex-start;margin:5px 0 5px 12px;padding:9px 12px;font-size:18px;line-height:1.5}.lk .ar{font-size:26px;font-weight:900;color:#e8590c;line-height:1}.lk .cu{display:inline-block;background:#6a3fe0;color:#fff;font-weight:800;border-radius:8px;padding:0 9px;margin-right:6px;font-size:18px}
@media(max-width:640px){body{font-size:17.5px}.sr{grid-template-columns:36px 1fr}.en{grid-column:2;padding:10px 8px 6px 0}.ko{grid-column:2;border-radius:10px;margin:0 8px 10px 0;padding:8px 10px}.sr.st .ko{margin-bottom:8px}.ah{font-size:21px}.hero h1{font-size:27px}main{padding:10px 6px 60px}.inner{padding:11px}}

  async function signBody(keyHex, body) {   // 기록 서명(2026-10-08): 채점 기록을 앱 열쇠로 HMAC-SHA256 → 서버가 검증, 위조 기록·가짜 합격 문자 차단
    const k = await crypto.subtle.importKey('raw', hex2b(keyHex), {name: 'HMAC', hash: 'SHA-256'}, false, ['sign']);
    const sig = await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(canon(body)));
    return Array.from(new Uint8Array(sig), x => x.toString(16).padStart(2, '0')).join('');
  }
  return {run, open, openBytes, keyOf, hex2b, able, imgUrl, lazy, signBody, canon};
})();

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const NUM = '❶❷❸❹❺❻❼❽❾❿⓫⓬⓭⓮⓯⓰⓱⓲⓳⓴', CIR = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮';
const nm = n => NUM[n - 1] || n, ci = i => CIR[i] || i + 1;
const HUE = [['#5b4bdb', '#8b7bff'], ['#e0417c', '#ff7aa8'], ['#0e9f8e', '#3fd1bd'], ['#ef7d00', '#ffb347'], ['#2374e1', '#5fa8ff'], ['#8a2be2', '#c77dff'], ['#d9480f', '#ff8c5a'], ['#2b9348', '#6fcf7f']];
function hue(i) { const h = HUE[i % HUE.length]; document.documentElement.style.setProperty('--h1', h[0]); document.documentElement.style.setProperty('--h2', h[1]); return h; }
function unitHTML(u) {
  const S = (k, c, l) => u[k] && u[k].ko ? `<div class="sc ${c}"><span class="l">${l}</span><div class="k">${esc(u[k].ko)}</div>${u[k].en ? `<div class="e">${esc(u[k].en)}</div>` : ''}</div>` : '';
  let h = `<article id="a-${esc(u.id)}"><div class="ah">${esc(u.label)}</div><div class="inner"><div class="sum">${S('title', 't', '제목')}${S('topic', 'p', '주제')}${S('gist', 'g', '요지')}</div>`;
  h += '<div class="sh ps">📖 지문 · 해석</div>';
  h += u.s.map(s => `<div class="sr${s.st ? ' st' : ''}">${s.st ? '<div class="stag">✍ 서술형 대비</div>' : ''}<div class="no">${nm(s.n)}</div><div class="en">${s.h}</div><div class="ko">${esc(s.ko)}</div></div>`).join('');
  if (u.gram.length) h += '<div class="sh gr">✏️ 핵심 어법</div>' + u.gram.map((g, i) => `<div class="gi"><div class="n">${ci(i)}</div><div>${g.x ? `<div class="q">${g.n ? `<span class="sn">${nm(g.n)}</span> ` : ''}${esc(g.x)}</div>` : ''}<div class="w">${esc(g.t)}</div></div></div>`).join('');
  if (u.voc.length) h += '<div class="sh vo">💡 핵심 어휘</div>' + u.voc.map(v => `<div class="vi"><span class="wd">${esc(v.w)}</span><span class="m">${esc(v.m)}</span>${v.syn || v.ant ? `<div class="tg">${(v.syn || '').split(/\s*[,;]\s*/).filter(Boolean).map(x => `<span class="y">= ${esc(x)}</span>`).join('')}${(v.ant || '').split(/\s*[,;]\s*/).filter(Boolean).map(x => `<span class="a">↔ ${esc(x)}</span>`).join('')}</div>` : ''}</div>`).join('');
  if (u.flow && u.flow.length) {
    h += '<div class="sh fl">🔀 순서 · 흐름 정리</div>';
    u.flow.forEach((f, i) => {
      if (i) h += `<div class="lk"><span class="ar">⬇</span><div>${f.cue ? `<span class="cu">${esc(f.cue)}</span>` : ''}${esc(f.why || '')}</div></div>`;
      h += `<div class="st0"><div class="h"><span class="rg">${f.r[0] === f.r[1] ? nm(f.r[0]) : nm(f.r[0]) + ' ~ ' + nm(f.r[1])}</span><span class="tt">${esc(f.tag)}</span></div><div class="x">${esc(f.t)}</div></div>`;
    });
  }
  return h + '</div></article>';
}
let tick = 0, curG = -1;
function renderHome() {
  curG = -1; hue(0); window.scrollTo(0, 0);
  const last = exst.get('gpos', null);
  let r = '';
  if (last && D.groups[last.g]) { const u = D.groups[last.g].units.find(x => x.id === last.id); if (u) r = `<a class="res" href="#g${last.g}/${esc(last.id)}"><i>▶️</i>이어서 보기 · ${esc(u.label)}<em>›</em></a>`; }
  if (D.ainca) r += `<a class="res" href="${esc(D.ainca)}"><i>📑</i>지문분석 보기<em>›</em></a>`;
  const cards = D.groups.map((g, i) => { const h = HUE[i % HUE.length]; return `<a class="gc" href="#g${i}" style="background:linear-gradient(130deg,${h[0]},${h[1]})"><b>${esc(g.name)}</b><span>${g.units.length}지문 한 번에 보기</span></a>`; }).join('');
  $('#app').innerHTML = `<div class="hero"><small>${esc(D.school)}</small><h1>${esc(D.short)}</h1><p>${esc(D.sub)}</p></div><div class="home">${r}<div class="hh">단원을 고르세요</div><div class="gg">${cards}</div></div>`;
}
function renderGroup(i, id) {
  const g = D.groups[i]; if (!g) return renderHome();
  hue(i);
  if (curG !== i) {
    curG = i;
    $('#app').innerHTML = `<div class="top"><div class="tr"><a class="bk" href="#">‹ 목차</a><b>${esc(g.name)}</b></div><div class="chips">${g.units.map(u => `<a href="#g${i}/${esc(u.id)}" data-a="${esc(u.id)}">${esc(u.chip)}</a>`).join('')}</div></div><main>${g.units.map(unitHTML).join('')}</main>`;
  }
  requestAnimationFrame(() => { const e = id && document.getElementById('a-' + id); if (e) e.scrollIntoView(); else window.scrollTo(0, 0); });
}
function onScroll() {
  if (curG < 0 || tick) return;
  tick = setTimeout(() => { tick = 0; const g = D.groups[curG]; if (!g) return; let cur = g.units[0];
    for (const u of g.units) { const e = document.getElementById('a-' + u.id); if (e && e.getBoundingClientRect().top < 150) cur = u; }
    exst.set('gpos', {g: curG, id: cur.id});
    document.querySelectorAll('.chips a').forEach(a => { const on = a.dataset.a === cur.id; if (on && !a.classList.contains('on')) a.scrollIntoView({inline: 'center', block: 'nearest'}); a.classList.toggle('on', on); });
  }, 180);
}
function route() { const m = location.hash.match(/^#g(\d+)(?:\/(.+))?$/); if (m) renderGroup(+m[1], m[2] ? decodeURIComponent(m[2]) : ''); else renderHome(); }
function renderBook() { window.addEventListener('hashchange', route); window.addEventListener('scroll', onScroll, {passive: true}); route(); }
const NS = 'ex:' + D.salt + ':';
const exst = {
  get(k, d) { try { const v = localStorage.getItem(NS + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const KEYST = {get: () => exst.get('k', ''), set: v => exst.set('k', v), del: () => exst.set('k', '')};
const pad = n => String(n).padStart(2, '0');
const fmtTime = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const cleanName = s => s.replace(/\s+/g, ' ').trim();
const DEVICE = (() => { let d = exst.get('device', ''); if (!d) { d = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random()).slice(0, 8); exst.set('device', d); } return d; })();
let IMGKEY = null;
async function gate(name, range) {     // 시험 앱과 같은 시작 판정(이름·기기ID 짝) + 열쇠 — 토익 워크북 wb_template와 같은 코드
  if (!D.reportUrl) return {allow: true};
  for (let i = 0; i < 2; i++) {
    if (i) { const m = document.getElementById('msg'); if (m) m.textContent = '서버 응답이 늦어 한 번 더 확인하는 중…'; }
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 60000);
    try {
      const r = await fetch(D.reportUrl, {method: 'POST', signal: ctl.signal, headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({event: 'start', name, range, device: DEVICE, app: D.title, salt: D.enc ? D.salt : undefined, time: fmtTime(new Date()), ua: navigator.userAgent.slice(0, 120)})});
      const txt = await r.text();
      try { const j = JSON.parse(txt); return typeof j.allow === 'boolean' ? j : {allow: true}; } catch (e) { return {allow: true, legacy: true}; }
    } catch (e) { if (i) return {allow: false, offline: true}; await new Promise(res => setTimeout(res, 1500)); }
    finally { clearTimeout(t); }
  }
}
function nameOk() {
  const name = cleanName($('#name').value);
  if (!name) { $('#msg').textContent = '이름을 먼저 입력하세요.'; $('#name').focus(); window.scrollTo(0, 0); return false; }
  if (window.LEESS && !LEESS.ok(name)) { $('#msg').textContent = LEESS.msg(); $('#name').focus(); window.scrollTo(0, 0); return false; } /*LEESS*/
  exst.set('name', name); $('#msg').textContent = ''; return true;
}
function renderLocked() {
  let saved = exst.get('name', ''); try { saved = saved || localStorage.getItem('leess-vname') || ''; } catch (e) {}
  $('#app').innerHTML = `<div class="lock"><h1>${esc(D.school)} ${esc(D.short)}</h1><p class="sub">${esc(D.sub)}</p>
  <div class="note"><b>교재 열기</b><p style="margin:6px 0 10px">본인 이름(실명)을 쓰고 「교재 열기」를 누르세요. 처음 쓰는 기기는 인터넷 연결이 필요합니다. ${esc(D.notice)}</p>
  <input type="text" id="name" placeholder="이름 (필수)" autocomplete="off" value="${esc(saved)}" style="width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)">
  <p id="msg" style="color:var(--ng);font-size:14px;min-height:1.4em;margin:8px 0"></p>
  <button class="btn pri" id="openWb" style="width:100%;padding:10px">교재 열기</button></div></div>`;
  $('#openWb').onclick = openWb;
}
async function openWb() {
  if (!nameOk()) return;
  $('#msg').textContent = '서버에서 이름·기기를 확인하는 중…'; $('#openWb').disabled = true;
  const g = await gate(exst.get('name', ''), D.short + ' 열기');
  $('#openWb').disabled = false;
  if (!g.allow) { $('#msg').textContent = g.offline ? '서버에 연결하지 못했습니다. 통신 상태를 확인한 뒤 다시 시도하세요.' : (g.msg || '이 기기에서는 시작할 수 없습니다. 선생님께 문의하세요.'); return; }
  const u = await UNLOCK.run(D, g, KEYST);
  if (!u.ok) { $('#msg').textContent = u.msg; return; }
  if (u.key) IMGKEY = await UNLOCK.keyOf(u.key);
  renderBook();
}
async function boot() {
  if (D.enc && KEYST.get()) { const u = await UNLOCK.run(D, null, KEYST); if (u.ok) { if (u.key) IMGKEY = await UNLOCK.keyOf(u.key); renderBook(); return; } }
  renderLocked();
}
boot();
