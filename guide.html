const $=s=>document.querySelector(s);const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NS='ex:'+D.salt+':';
const exst={get(k,d){try{const v=localStorage.getItem(NS+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(NS+k,JSON.stringify(v));return true}catch(e){return false}}};
const KEYST={get:()=>exst.get('k',''),set:v=>exst.set('k',v),del:()=>exst.set('k','')};
const pad=n=>String(n).padStart(2,'0');const fmtTime=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const cleanName=s=>s.replace(/\s+/g,' ').trim();
const DEVICE=(()=>{let d=exst.get('device','');if(!d){d=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()).slice(0,8);exst.set('device',d)}return d})();
async function gate(name,range){if(!D.reportUrl)return{allow:true};
 for(let i=0;i<2;i++){if(i){const m=$('#msg');if(m)m.textContent='서버 응답이 늦어 한 번 더 확인하는 중…'}
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),60000);
  try{const r=await fetch(D.reportUrl,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({event:'start',name,range,device:DEVICE,app:D.title,salt:D.enc?D.salt:undefined,time:fmtTime(new Date()),ua:navigator.userAgent.slice(0,120)})});
   const txt=await r.text();try{const j=JSON.parse(txt);return typeof j.allow==='boolean'?j:{allow:true}}catch(e){return{allow:true,legacy:true}}}
  catch(e){if(i)return{allow:false,offline:true};await new Promise(res=>setTimeout(res,1500))}finally{clearTimeout(t)}}}
function nameOk(){const name=cleanName($('#name').value);
  if (!name) { $('#msg').textContent = '이름을 먼저 입력하세요.'; $('#name').focus(); window.scrollTo(0, 0); return false; }
  if (window.LEESS && !LEESS.ok(name)) { $('#msg').textContent = LEESS.msg(); $('#name').focus(); window.scrollTo(0, 0); return false; } /*LEESS*/
  exst.set('name',name);$('#msg').textContent='';return true}
const top_=(back)=>`<div class="top"><img src="${LOGO}" alt="이승수영어">${back?'<a href="#">목차</a>':''}</div>`;
function renderLocked(){let saved=exst.get('name','');try{saved=saved||localStorage.getItem('leess-vname')||''}catch(e){}
 $('#app').innerHTML=top_()+`<h1>${esc(D.title)}</h1><p class="sub">${esc(D.sub)}</p><div class="note"><b>교재 열기</b><p style="margin:6px 0 2px">본인 이름(실명)을 쓰고 「교재 열기」를 누르세요. 처음 쓰는 기기는 인터넷 연결이 필요합니다.</p>
 <input type="text" id="name" placeholder="이름 (필수)" autocomplete="off" value="${esc(saved)}"><div id="consentCard" hidden style="margin-top:10px;font-size:13.5px;line-height:1.6"><b>개인정보 수집·이용 동의</b><p style="margin:6px 0 8px">${D.consent||''}</p><button class="btn pri" id="consentOk">동의하고 열기</button> <button class="btn" id="consentNo">동의하지 않음</button></div><p id="msg"></p><button class="btn pri" id="openBk" style="width:100%">교재 열기</button></div>`;
 $('#openBk').onclick=openBk;$('#consentOk').onclick=()=>{if(!nameOk())return;exst.set('consent',fmtTime(new Date()));$('#consentCard').hidden=true;openBk()};$('#consentNo').onclick=()=>{$('#consentCard').hidden=true;$('#msg').textContent='동의하지 않으면 이 교재를 이용할 수 없습니다.'}}
async function openBk(){if(!nameOk())return;if(D.consent&&!exst.get('consent','')){$('#consentCard').hidden=false;return}
 $('#msg').textContent='서버에서 이름·기기를 확인하는 중…';$('#openBk').disabled=true;const g=await gate(exst.get('name',''),'시험대비 교재');$('#openBk').disabled=false;
 if(!g.allow){$('#msg').textContent=g.offline?'서버에 연결하지 못했습니다. 통신 상태를 확인한 뒤 다시 시도하세요.':(g.msg||'이 기기에서는 시작할 수 없습니다. 선생님께 문의하세요.');return}
 const u=await UNLOCK.run(D,g,KEYST);if(!u.ok){$('#msg').textContent=u.msg;return}boot()}
const done=()=>exst.get('gd-done',{});
function home(){const dn=done();let h=top_()+`<h1>${esc(D.title)}</h1><p class="sub">${esc(D.sub)}</p><p class="lg"><u class="g">밑줄</u><sup>ⓐ</sup> 핵심 어법 &nbsp; <b>굵은 글씨</b> 핵심 어휘 &nbsp; <span class="st">★</span> 빈칸·서술형 핵심 문장 &nbsp; (3) 문장 번호</p>`,cur='';
 D.toc.forEach((t,i)=>{if(t.s!==cur){cur=t.s;h+=`<h3>${esc(cur)}</h3>`}h+=`<button class="it" data-i="${i}"><b>${esc(t.b)}</b><span class="tt">${esc(t.t)}</span><span class="ck">${dn[t.id]?'✓':''}</span></button>`});
 $('#app').innerHTML=h;document.querySelectorAll('.it').forEach(b=>b.onclick=()=>{location.hash=D.toc[+b.dataset.i].id})}
function card(i){const t=D.toc[i],dn=done();$('#app').innerHTML=top_(1)+D.cards[t.id]+`<div class="nav"><button class="btn" id="pv" ${i?'':'disabled'}>이전</button><button class="btn pri" id="dn">${dn[t.id]?'다 봤어요 ✓':'다 봤어요'}</button><button class="btn" id="nx" ${i<D.toc.length-1?'':'disabled'}>다음</button></div>`;
 $('#pv').onclick=()=>{location.hash=D.toc[i-1].id};$('#nx').onclick=()=>{location.hash=D.toc[i+1].id};
 $('#dn').onclick=()=>{const d=done();if(d[t.id])delete d[t.id];else d[t.id]=1;exst.set('gd-done',d);card(i)};window.scrollTo(0,0)}
function route(){const id=location.hash.slice(1),i=D.toc.findIndex(t=>t.id===id);if(i>=0)card(i);else{home();window.scrollTo(0,0)}}
async function boot(){if(D.enc){const u=await UNLOCK.run(D,null,KEYST);if(!u.ok){renderLocked();return}}window.addEventListener('hashchange',route);route()}
boot();
</script><!--hubback-->
<script>/* 통합앱에서 열었을 때만 맨 위에 「‹ 전체 앱」(hubback.py) */
(function () {
  var u; try { u = sessionStorage.getItem('hub:back'); } catch (e) {}
  if (!u || u.indexOf(location.origin + '/') !== 0) return;
  var box = document.createElement('div'), a = document.createElement('a');
  box.setAttribute('style', 'max-width:780px;margin:0 auto;padding:10px 16px 0');
  a.id = 'hubBack'; a.href = u; a.textContent = '‹ 전체 앱';
  a.setAttribute('style', 'display:inline-block;padding:6px 14px 6px 10px;border:1px solid var(--line,#e1e0da);border-radius:999px;background:var(--card,#fff);color:var(--acc,#2f5bd3);font:600 14px/1.4 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-decoration:none');
  a.onclick = function (e) {
    var t = document.getElementById('test'), h = document.getElementById('home');   // 시험 화면이 있는 앱은 그것으로, 없으면 첫 화면이 보이는지로
    var idle = t ? (t.hidden || t.offsetParent === null) : (!!h && !h.hidden && h.offsetParent !== null);
    if (!idle && !confirm('전체 앱 목록으로 돌아갈까요?\n지금 푸는 문제는 이어서 풀 수 없을 수도 있습니다.')) e.preventDefault();
  };
  box.appendChild(a);
  document.body.insertBefore(box, document.body.firstChild);
  // 선생님 앱(leess-teacher)에서 왔으면 선생님 화면을 바로 연다(코드는 선생님 앱이 이 앱의 코드 자리에 넣어 두었다). 한 번만.
  var tf; try { tf = sessionStorage.getItem('hub:teacher'); sessionStorage.removeItem('hub:teacher'); } catch (e) {}
  var tb = document.getElementById('teacherBtn');
  if (tf === '1' && tb && !tb.hidden) tb.click();
})();
</script>
