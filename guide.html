<style>
:root{--w:#7a1f35;--line:#d9d9d9;--ink:#111}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:7px;margin-bottom:12px}.top img{height:26px;display:block}.top a{font-size:calc(14px*var(--fz,1));color:var(--w);font-weight:700;text-decoration:none}
h1{font-size:calc(23px*var(--fz,1));color:var(--w);margin:8px 0 4px}.sub{font-size:calc(14px*var(--fz,1));color:#444;margin:0 0 12px;line-height:1.5}
.note{border:1px solid var(--line);border-radius:10px;padding:14px;font-size:calc(15px*var(--fz,1));line-height:1.55}
.note input{width:100%;font:inherit;padding:10px 12px;border:1px solid #bbb;border-radius:9px;margin-top:8px}
.btn{font:inherit;font-weight:700;border:1px solid var(--w);background:#fff;color:var(--w);border-radius:9px;padding:10px 14px}.btn.pri{background:var(--w);color:#fff}.btn:disabled{opacity:.45}
#msg{color:#b3261e;font-size:calc(14px*var(--fz,1));min-height:1.4em;margin:8px 0}
.lg{font-size:calc(13.5px*var(--fz,1));color:#333;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 0;margin:0 0 8px;line-height:1.7}
h3{font-size:calc(16px*var(--fz,1));color:var(--w);margin:16px 0 4px}
.it{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #eee;padding:10px 2px;font:inherit;color:inherit;font-size:calc(15px*var(--fz,1))}
.it b{flex:none;width:5.6em;font-size:calc(14px*var(--fz,1))}.it .tt{flex:1;line-height:1.35}.ck{flex:none;width:18px;height:18px;border:1.5px solid #888;border-radius:4px;text-align:center;font-size:calc(13px*var(--fz,1));line-height:15px;color:var(--w);font-weight:800}
.hd{font-size:calc(18px*var(--fz,1));margin:2px 0 8px}.hd b{color:var(--w);margin-right:4px}.ty{float:right;font-size:calc(13px*var(--fz,1));color:#666;margin-top:3px}
table{border-collapse:collapse;width:100%}col{width:auto}.c0{width:36px}.c1{width:58%}
.p td{vertical-align:top;padding:9px 0;border-bottom:1px dotted #bbb}.p td.n{font-size:calc(11.5px*var(--fz,1));color:#888;padding-top:12px}
.st{color:var(--w)}
td.e{font-family:"Times New Roman",Georgia,serif;font-size:calc(17px*var(--fz,1));line-height:1.5;padding-right:12px}td.k{font-size:calc(14.5px*var(--fz,1));line-height:1.55;color:#222;border-left:1px solid #aaa;padding-left:12px;word-break:keep-all}
u.g{text-decoration:underline;text-decoration-color:var(--w);text-decoration-thickness:1.5px;text-underline-offset:3px}
sup{font-size:calc(11px*var(--fz,1));color:var(--w);line-height:0;margin-left:1px;font-family:-apple-system,sans-serif}
.off td.e,.off td.k{color:#777}.tg{font-style:normal;font-family:-apple-system,sans-serif;font-size:calc(11px*var(--fz,1));border:1px solid #777;padding:0 3px;margin-right:3px}.sp{font-style:normal;font-weight:700}
.idea{margin-top:12px;border-top:2px solid #111;border-bottom:1px solid #111}.idea th{font-size:calc(13px*var(--fz,1));color:var(--w);text-align:left;vertical-align:top;padding:7px 0;white-space:nowrap}.idea td{vertical-align:top;padding:7px 0;border-bottom:1px dotted #bbb}.idea tr:last-child td,.idea tr:last-child th{border-bottom:0}
.idea td.e{font-size:calc(16px*var(--fz,1));line-height:1.35}.idea td.k{font-size:calc(14px*var(--fz,1));line-height:1.45}
h4{margin:0 0 4px;font-size:calc(14.5px*var(--fz,1));color:var(--w)}
.two{display:grid;grid-template-columns:58% 1fr;gap:14px;margin-top:12px}
ol,ul{list-style:none;margin:0;padding:0}.gr li,.vo li,.pred li{font-size:calc(14px*var(--fz,1));line-height:1.5;margin-bottom:4px;word-break:keep-all}.gr b,.vo b{font-family:"Times New Roman",Georgia,serif;font-size:calc(15.5px*var(--fz,1))}.c{color:var(--w)}.sy{font-family:"Times New Roman",Georgia,serif;color:#444}
.pred{margin-top:12px;border-top:1px solid #111;padding-top:8px}.pk{font-weight:800;margin-right:5px}
.nav{display:flex;gap:8px;margin-top:18px}.nav .btn{flex:1;padding:12px 4px}
@media(max-width:640px){
 table,tbody,.p tr,.p td,.idea tr,.idea td,.idea th{display:block;width:auto}colgroup{display:none}
 .p tr{position:relative;border-bottom:1px dotted #bbb;padding:9px 0}.p td{border:0;padding:0}.p td.n{position:absolute;left:0;top:13px;width:26px;padding:0;font-size:calc(11px*var(--fz,1));line-height:1.1}
 .p td.e{padding:0 0 0 28px}.p td.k{border:0;padding:5px 0 0 28px;color:#444}
 .idea tr{padding:7px 0;border-bottom:1px dotted #bbb}.idea tr:last-child{border-bottom:0}.idea th,.idea td{padding:0;border:0}.idea td.e{padding:2px 0 0}.idea td.k{border:0;padding:3px 0 0;color:#444}
 .two{grid-template-columns:1fr}
}

const $=s=>document.querySelector(s);const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NS='ex:'+D.salt+':';
const exst={get(k,d){try{const v=localStorage.getItem(NS+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(NS+k,JSON.stringify(v));return true}catch(e){return false}}};
const KEYST={get:()=>exst.get('k',''),set:v=>exst.set('k',v),del:()=>exst.set('k','')};
const pad=n=>String(n).padStart(2,'0');const fmtTime=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const cleanName=s=>s.replace(/\s+/g,' ').trim();
const DEVICE=(()=>{let d=exst.get('device','');if(!d){d=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()).slice(0,8);exst.set('device',d)}return d})();
async function gate(name,range){if(!D.reportUrl)return{allow:true};
 for(let i=0;i<2;i++){if(i){const m=$('#msg');if(m)m.textContent='서버 응답이 늦어 한 번 더 확인하는 중…'}
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),60000);
  try{const r=await fetch(D.reportUrl,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({event:'start',name,range,device:DEVICE,app:D.title,salt:D.enc?D.salt:undefined,time:fmtTime(new Date()),ua:navigator.userAgent.slice(0,120)})});
   const txt=await r.text();try{const j=JSON.parse(txt);return typeof j.allow==='boolean'?j:{allow:true}}catch(e){return{allow:true,legacy:true}}}
  catch(e){if(i)return{allow:false,offline:true};await new Promise(res=>setTimeout(res,1500))}finally{clearTimeout(t)}}}
function nameOk(){const name=cleanName($('#name').value);
  if (!name) { $('#msg').textContent = '이름을 먼저 입력하세요.'; $('#name').focus(); window.scrollTo(0, 0); return false; }
  if (window.LEESS && !LEESS.ok(name)) { $('#msg').textContent = LEESS.msg(); $('#name').focus(); window.scrollTo(0, 0); return false; } /*LEESS*/
  exst.set('name',name);$('#msg').textContent='';return true}
const top_=(back)=>`<div class="top"><img src="${LOGO}" alt="이승수영어">${back?'<a href="#">목차</a>':''}</div>`;
function renderLocked(){let saved=exst.get('name','');try{saved=saved||localStorage.getItem('leess-vname')||''}catch(e){}
 $('#app').innerHTML=top_()+`<h1>${esc(D.title)}</h1><p class="sub">${esc(D.sub)}</p><div class="note"><b>교재 열기</b><p style="margin:6px 0 2px">본인 이름(실명)을 쓰고 「교재 열기」를 누르세요. 처음 쓰는 기기는 인터넷 연결이 필요합니다.</p>
 <input type="text" id="name" placeholder="이름 (필수)" autocomplete="off" value="${esc(saved)}"><div id="consentCard" hidden style="margin-top:10px;font-size:calc(13.5px*var(--fz,1));line-height:1.6"><b>개인정보 수집·이용 동의</b><p style="margin:6px 0 8px">${D.consent||''}</p><button class="btn pri" id="consentOk">동의하고 열기</button> <button class="btn" id="consentNo">동의하지 않음</button></div><p id="msg"></p><button class="btn pri" id="openBk" style="width:100%">교재 열기</button></div>`;
 $('#openBk').onclick=openBk;$('#consentOk').onclick=()=>{if(!nameOk())return;exst.set('consent',fmtTime(new Date()));$('#consentCard').hidden=true;openBk()};$('#consentNo').onclick=()=>{$('#consentCard').hidden=true;$('#msg').textContent='동의하지 않으면 이 교재를 이용할 수 없습니다.'}}

    add(document.querySelectorAll('.ink-text'), 'text');   // 11-12 시험보기: #app 밖 보기 창의 글 지문(쪽 그림이 없는 지문)에도 필기
    add(document.querySelectorAll('.gc-month'), 'text');   // 11-10 일정표 달력: 달 블록 하나 = 카드 하나(학생·달로 저장)
    return out;
  }
  // 뿌리의 자식 가운데 필기 카드가 될 것 — 달력(.gc-month)을 품은 칸은 통째로 붙이지 않고 그 안의 .card만(달력은 달 블록으로 따로)
  const kids = root => { const out = []; for (const x of root.children) { if (x.nodeType !== 1 || x.matches(SKIP)) continue; if (x.querySelector('.gc-month')) { for (const c of x.querySelectorAll('.card')) if (!c.querySelector('.gc-month') && !c.closest('.gc-wrap')) out.push(c); } else out.push(x); } return out; };
  const vis = el => el.getClientRects().length > 0;
  function norm(el) {   // 카드의 내용 지문(指紋): 그림·음원 파일 이름 + 글자(빈칸에 쓴 답·글상자는 들어가지 않는다)
    let t = ''; el.querySelectorAll('[data-enc],img[src]').forEach(i => { const k = i.dataset.enc || i.getAttribute('src') || ''; if (k && !/^(blob|data):/.test(k)) t += k + '|'; });
    return t + (el.textContent || '').replace(/\s+/g, ' ').trim();
  }
  function hash(s) { let a = 2166136261, b = 5381; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); a = Math.imul(a ^ c, 16777619); b = (Math.imul(b, 33) + c) | 0; } return (a >>> 0).toString(36) + (b >>> 0).toString(36); }
  const sigs = new WeakMap();
  function ident(el, kind) {   // {id, …} — 글 카드는 내용이 그대로면 다시 계산하지 않는다
    if (kind === 'book') return {id: `${SALT}:${PAGE}:${(location.hash.match(/^#g(\d+)/) || [])[1]}:${el.id}:${NARROW.matches ? 'm' : 'w'}`};
    if (kind === 'img') return {id: `${SALT}:${PAGE}:${BOOK}:p${el.dataset.p || new URLSearchParams(location.search).get('p') || 1}`};
    if (el.classList.contains('gc-month')) return {id: `${SALT}:${PAGE}:cal:${(el.closest('.gc-wrap') || {dataset: {}}).dataset.ink || ''}:${el.id}`};   // 일정표: 학생·달로 고정(내용이 바뀌어도 같은 카드)
    const sig = (el.textContent || '').length + '/' + el.querySelectorAll('[data-enc],img[src]').length, old = sigs.get(el);
    if (old && old.sig === sig) return old;
    // head = 첫머리(「3. 주제」처럼 번호+유형 두 글자, 번호가 없으면 24자), probes = 본문 가운데 두 토막. 채점으로 해설·정오 표시가 덧붙어도 토막은 남는다 → 같은 카드로 본다
    const n = norm(el), L = n.length, v = {sig, n, id: `${SALT}:${PAGE}:t:${hash(n)}:${NARROW.matches ? 'm' : 'w'}`, head: (n.match(/^\d+\s*[.)]\s*\S{0,2}/) || [n.slice(0, 24)])[0], probes: [n.substr(L / 3 | 0, 40), n.substr(2 * L / 3 | 0, 40)]};
    sigs.set(el, v); return v;
  }
  const same = (c, v) => c.probes.some(p => v.n.includes(p));
  const blank = (id, kind) => ({id, salt: SALT, page: PAGE, kind, w: 0, s: []});
  const tag = (c, v) => { c.sig = v.sig; c.head = v.head || ''; c.probes = v.probes || ['']; c.len = v.n ? v.n.length : 0; return c; };
  function mount(el, kind, q, v) { const c = tag(INK.mount(el, kind, q), v); cards.set(el, c); return c; }
  function unmount(c) { INK.unmount(c); cards.delete(c.el); }

  function sync() {
    stimer = 0; cand = candidates(); const gone = [];   // 같은 문항이 새로 그려지면(채점 뒤 다시 그리기) 필기를 넘겨준다
    for (const [el, c] of [...cards]) {
      if (cand.has(el) && el.isConnected && c.svg.parentNode === el) continue;
      if (c.kind === 'text' && c.q.s.length && c.len >= 40) gone.push(c);
      unmount(c);
    }
    let any = false;
    for (const [el, kind] of cand) {
      if (!any && vis(el)) any = true;
      const c = cards.get(el), v = ident(el, kind);
      if (c) {
        if (INK.busy()) continue;
        if (kind === 'img') { if (v.id !== c.q.id) INK.setRecord(c, recs.get(v.id) || blank(v.id, kind)); }
        else if (kind === 'text' && v.sig !== c.sig) { const keepIt = same(c, v); if (keepIt) c.sig = v.sig; else { INK.setRecord(c, recs.get(v.id) || blank(v.id, kind)); tag(c, v); } }   // 카드는 그대로인데 속 내용이 통째로 바뀐 경우
        continue;
      }
      let q = recs.get(v.id);
      if (!q && kind === 'text') { const g = gone.find(g => g.head === v.head && g.q.id !== v.id && g.probes.every(p => v.n.includes(p))); if (g) { q = {...g.q, id: v.id, s: g.q.s.map(s => ({...s, p: s.p.slice()}))}; save(q); } }
      if (q) mount(el, kind, q, v);
    }
    INK.bar(any);
  }
  const schedule = () => { if (!stimer) stimer = setTimeout(sync, 60); };
  const ours = n => n.nodeType === 1 && n.matches && n.matches(INKSEL);
  const mine = m => {
    const t = m.target.nodeType === 1 ? m.target : m.target.parentElement; if (t && t.closest(INKSEL)) return true;
    if (m.type === 'childList') { const ns = [...m.addedNodes, ...m.removedNodes]; return ns.length > 0 && ns.every(ours); }
    return false;
  };
  new MutationObserver(ms => { if (!ms.every(mine)) schedule(); }).observe(document.body, {childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'src']});
  addEventListener('hashchange', schedule); addEventListener('popstate', schedule);
  NARROW.addEventListener('change', async () => { await flush(); [...cards.values()].forEach(unmount); sync(); INK.status('이 방향에서 쓴 필기만 보입니다'); });

  INK.init({
    save: c => save(c.q), onPen: schedule,
    units() {   // 엔진이 두 손가락 확대로 키울 묶음(2판): 문항 목록(#qs·#exs)은 통째로, 그 밖은 카드 하나씩. 목록·현황·달력 화면은 묶음을 주지 않는다(= 브라우저 확대 그대로)
      const out = new Set();
      for (const [el] of cand) {
        if (!el.isConnected || !vis(el)) continue;
        if (!el.matches('.ink-page,.ink-text') && (el.classList.contains('gc-month') || el.closest('#view,#main'))) continue;
        const p = el.parentElement; out.add(p && (p.id === 'qs' || p.id === 'exs') ? p : el);
      }
      return [...out];
    },
    cardAt(t) {   // 펜이 닿은 자리의 카드 — 필기가 없던 카드는 이때 필기층을 만든다
      cand = candidates(); let el = null; for (let n = t; n && n !== document.body; n = n.parentElement) if (cand.has(n)) { el = n; break; }
      if (!el) return null;
      let c = cards.get(el); if (c && c.svg.parentNode !== el) { unmount(c); c = null; }
      if (!c) { const kind = cand.get(el), v = ident(el, kind); c = mount(el, kind, recs.get(v.id) || blank(v.id, kind), v); }
      return c;
    },
  });
  window.BOOKNOTE = {dump: () => tx('readonly', s => s.index('salt').getAll(SALT)), cards: () => cards.size};
  load().then(sync);
})();
</script>
<script id="tdevJs">
/* 선생님 기기 자동 등록(2026-11-10 사용자: 아이패드가 앱마다 「다른 학생 이름으로 등록」으로 막힘 → 「모든 앱을 고쳐」).
   기기ID는 앱·홈 화면 앱마다 따로 생긴다. 이 브라우저에 선생님 코드가 있으면 저장소의 모든 기기ID를 서버(tdev)에 등록해 이름 잠금·경고에서 뺀다.
   코드가 없는 기기는 이름 칸에 선생님 코드를 한 번 치면 등록된다(코드는 서버가 확인, 화면·주소에 남기지 않는다). tdev_all.py가 게시 때마다 끼운다. */
(function () {
  if (window.__leessStudent) return;   // 이승수영어 앱(학생)에서는 선생님 기기 등록을 하지 않는다 — 숨은 기능 없음(11-17 앱스토어 심사)
  var U = 'https://script.google.com/macros/s/AKfycbyKGf4h-cdSKteg8QPTjZTvUVsbowp4S0WvaRuyzjFq4Xwm1nc9mOKl70P0tqKzyOKm/exec', RX = /^[A-Za-z0-9.-]{3,40}$/, busy = false, tries = 0, bad = {};
  function val(k) { var v = null; try { v = localStorage.getItem(k); v = JSON.parse(v); } catch (e) {} return typeof v === 'string' ? v : ''; }
  function keys(re) { var a = []; try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (re.test(k)) a.push(k); } } catch (e) {} return a; }
  function ids() { var a = []; keys(/(^|:)device$/).forEach(function (k) { var v = val(k); if (RX.test(v) && a.indexOf(v) < 0) a.push(v); }); return a.sort(); }
  function codes() { var a = []; ['leess:tcode'].concat(keys(/(^|:)tcode$/)).forEach(function (k) { var v = val(k); if (v && a.indexOf(v) < 0) a.push(v); }); return a; }
  function post(code, devs) {
    return fetch(U, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({event: 'tdev', code: code, devs: devs})})
      .then(function (r) { return r.text(); }).then(function (t) { try { return !!JSON.parse(t).ok; } catch (e) { return false; } }).catch(function () { return null; });
  }
  function sync(codeIn) {   // true = 등록됨
    var devs = ids(), sig = devs.join(',');
    if (!devs.length || busy) return Promise.resolve(false);
    var cs = codeIn ? [codeIn] : codes().filter(function (c) { return bad[c] !== sig; });
    if (!cs.length) return Promise.resolve(false);
    if (!codeIn && val('leess:tcode') && localStorage.getItem('leess:tdevs') === sig) return Promise.resolve(true);
    busy = true;
    var i = 0;
    function next() {
      if (i >= cs.length) return false;
      var c = cs[i++];
      return post(c, devs).then(function (ok) {
        if (ok) { try { localStorage.setItem('leess:tdevs', sig); localStorage.setItem('leess:tcode', JSON.stringify(c)); } catch (e) {} return true; }
        if (ok === false) bad[c] = sig;
        return next();
      });
    }
    return Promise.resolve(next()).then(function (r) { busy = false; return r; }, function () { busy = false; return false; });
  }
  var t1 = 0, t2 = 0;
  function later() { clearTimeout(t1); t1 = setTimeout(function () { sync(); }, 900); }
  function isName(el) { return el && el.tagName === 'INPUT' && (el.id === 'name' || /이름/.test(el.getAttribute('placeholder') || '')); }
  document.addEventListener('input', function (e) {   // 이름 칸에 선생님 코드를 치면 등록
    var el = e.target; if (!isName(el)) return;
    clearTimeout(t2);
    t2 = setTimeout(function () {
      var v = (el.value || '').trim();
      if (!/^[!-~]{4,40}$/.test(v) || !/\d/.test(v) || !/[^A-Za-z0-9]/.test(v) || tries >= 6) return;   // cv2(11-17): 숫자와 기호가 함께 든 값만(선생님 코드 형식) — 로마자 이름은 보내지 않음
      tries++;
      sync(v).then(function (ok) { if (ok && (el.value || '').trim() === v) { el.value = ''; try { el.dispatchEvent(new Event('input', {bubbles: true})); } catch (e) {} alert('선생님 기기로 등록했습니다. 이제 학생 이름으로 들어가시면 됩니다.'); } });
    }, 700);
  }, true);
  document.addEventListener('click', later, true);   // 앱 안에서 코드를 넣은 직후(일곱 번 누르기 등)에도 바로 등록
  document.addEventListener('visibilitychange', function () { if (!document.hidden) later(); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', later); else later();
  setTimeout(function () { sync(); }, 3000);
})();
</script>
