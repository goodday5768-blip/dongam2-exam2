.top{display:block;padding:0}.tr{display:flex;align-items:center;gap:10px;padding:9px 12px}.tr b{font-size:calc(20px*var(--fz,1));flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
